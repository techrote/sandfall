name: Documentation and provenance

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandfall-documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Sandfall is standalone; preserve the original companion-workspace failures.
      - name: Checkout actual Sandfall source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          lfs: false
      - name: Verify CyberSand ancestry and Sandfall authority
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b48214da1935519002a6c4bfc6d7f465eb4a3eab HEAD
          test "$(git rev-parse 'b48214da1935519002a6c4bfc6d7f465eb4a3eab^2')" = 1d376fb38ff5df83691e468baa0639270a5f40e6
          test "$(git rev-parse '1d376fb38ff5df83691e468baa0639270a5f40e6^{tree}')" = 97eb0f4eeedde9bbe8b83047ca45c82d8a377d66
          grep -q '039008723172a951c7694079cd06c7a2ea137d40' docs/SANDFALL-V1-ARCHITECTURE-IMPLEMENTATION.md
          git diff --check HEAD
      - name: Check active CI provider policy and contract tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/check_ci_provider_policy.py
          python3 -m unittest discover -s tools/ci -p test_ci_provider_policy.py
          python3 -m unittest discover -s tools/sandfall -p 'test_sf_m*.py'
      - name: Materialize original runtime objects without rewriting provenance
        shell: bash
        run: |
          set -euo pipefail
          git lfs fetch origin "$(git rev-parse HEAD)"
          git lfs checkout
      - name: Retain original checker refusals and admit only an exact reviewed milestone delta
        shell: bash
        run: |
          set -euo pipefail
          # Later milestones deliberately change native inputs. Keep M0/M2
          # admission guards intact; the M3 gate independently pins the exact
          # six-file native patch and retains both earlier refusal records.
          if test -f tools/sandfall/sf_m3_reconcile.py; then
            python3 tools/sandfall/sf_m3_reconcile.py --output sf-m0-evidence/documentation-reconciliation.json
          elif test -f tools/sandfall/sf_m2_reconcile.py; then
            python3 tools/sandfall/sf_m2_reconcile.py --output sf-m0-evidence/documentation-reconciliation.json
          else
            python3 tools/sandfall/sf_m0_reconcile.py --output sf-m0-evidence/documentation-reconciliation.json
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          record=json.loads(Path('sf-m0-evidence/documentation-reconciliation.json').read_text())
          sf_m3=Path('tools/sandfall/sf_m3_reconcile.py').is_file()
          sf_m2=Path('tools/sandfall/sf_m2_reconcile.py').is_file()
          assert record['safe_for_fresh_web_build'] is True
          assert record['current_lfs_count']==18
          assert not record['unexpected_errors'] and not record['missing_expected_errors']
          if sf_m3:
              assert record['schema']=='sandfall-sf-m3-fresh-build-reconciliation-v1'
              assert record['expected_checker_error_count']==20
              assert record['original_m0_disposition']=='refused'
              assert record['original_m2_disposition']=='refused'
              old=record['original_m2_reconciliation']
              original=old['original_checker']
              assert old['safe_for_fresh_web_build'] is False
              assert original['status']=='failed'
              assert len(original['documentation']['errors'])==6
              assert len(original['errors'])==20
              checks=record['source_checks']
              for key in ('exact_baseline_tree', 'baseline_is_ancestor',
                          'no_untracked_native_sources', 'exact_reviewed_native_delta',
                          'unchanged_runtime_payloads_manifests_and_pins',
                          'unchanged_inherited_gates'):
                  assert checks[key] is True, key
              assert record['native_patch_record']['sha256']==checks['native_patch_sha256']
              print('RETAINED, NOT CLEARED: M0/M2 original refusals; six missing companion references, 14 inherited and SF-M2 stale desktop digests, plus four exact SF-M3 native desktop drifts. Fresh build admission only.')
          else:
              original=record['original_checker']
              assert original['status']=='failed'
              assert len(original['documentation']['errors'])==6
              assert len(original['errors'])==(16 if sf_m2 else 14)
              if sf_m2:
                  assert record['source_checks']['exact_registration_delta'] is True
                  assert record['source_checks']['unchanged_runtime_payloads_and_manifests'] is True
                  assert record['source_checks']['unchanged_native_core'] is True
              print('RETAINED, NOT CLEARED: six missing companion references, eight inherited desktop input digests' + (' and two exact SF-M2 registration drifts' if sf_m2 else ''))
          PY
      - name: Preserve original checker failures and separate scope decisions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sandfall-documentation-reconciliation-${{ github.run_id }}
          path: sf-m0-evidence/documentation-reconciliation*.json
          retention-days: 30
          if-no-files-found: warn
