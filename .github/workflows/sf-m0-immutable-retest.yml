name: SF-M0 immutable-artifact 600-tick Web retest and scoped native smoke

on:
  push:
    branches: [sf-m0/source-import-20261030]
    paths:
      - .github/workflows/sf-m0-immutable-retest.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sf-m0-immutable-retest
  cancel-in-progress: false

jobs:
  browser-retained-artifact:
    name: 600 actual native/Rapier ticks in browser (frozen Web artifact)
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - name: Checkout PR source and strict updated browser harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          lfs: false
      - name: Reuse original source-matched frozen Web export
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sandfall-sf-m0-compat-web
          run-id: 41111665444
          github-token: ${{ github.token }}
          path: .
      - name: Validate exact artifact and source ancestry, not a rebuilt substitute
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 98722560be89ccc3ab84eb3d526c5dde99c5cab0 HEAD
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path("build/web")
          info=json.loads((root/"build-info.json").read_text())
          assert info["source_commit"]=="98722560be89ccc3ab84eb3d526c5dde99c5cab0",info
          assert info["profile"]=="compat",info
          assert info["rapier"]=="0.35.2",info
          checked=0
          for row in (root/"SHA256SUMS").read_text().splitlines():
              sha,rel=row.split("  ",1)
              assert hashlib.sha256((root/rel).read_bytes()).hexdigest()==sha,rel
              checked+=1
          assert (root/"godot_rapier.wasm").is_file()
          assert checked>=5,checked
          print("SF_M0_FROZEN_WEB_RECEIPT_VALID",info["source_commit"],"entries",checked)
          PY
      - name: Re-run unchanged 600-tick physical acceptance with evidence-preserving 12-minute limit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sf-m0-immutable-retest
          python3 tools/serve_web.py --directory build/web --port 8038 >sf-m0-immutable-retest/http.log 2>&1 &
          CHROME="$(command -v google-chrome-stable || command -v google-chrome)"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader \
            --remote-debugging-port=9229 \
            --user-data-dir="$RUNNER_TEMP/sf-m0-immutable-retest" about:blank \
            >sf-m0-immutable-retest/chrome.log 2>&1 &
          timeout 950 node tools/sandfall/sf_m0_browser_probe.mjs \
            --port 9229 --url 'http://127.0.0.1:8038/?test=1&rapier=1' \
            --output sf-m0-immutable-retest/browser.json \
            --screenshot sf-m0-immutable-retest/browser.png \
            --timeout-ms 720000
      - name: Retain successful or failed real-browser result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sandfall-sf-m0-frozen-600tick-retest
          path: sf-m0-immutable-retest/
          retention-days: 21
          if-no-files-found: warn

  native-scoped-smoke:
    name: Strict source-matched core native smoke (not full suite)
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact current PR source and complete ancestry
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          lfs: false
      - name: Verify ancestry and run bounded native tools/physics checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sf-m0-native-smoke
          (
            git merge-base --is-ancestor b48214da1935519002a6c4bfc6d7f465eb4a3eab HEAD
            test "$(git rev-parse 'b48214da1935519002a6c4bfc6d7f465eb4a3eab^2')" = 1d376fb38ff5df83691e468baa0639270a5f40e6
            test "$(git rev-parse '1d376fb38ff5df83691e468baa0639270a5f40e6^{tree}')" = 97eb0f4eeedde9bbe8b83047ca45c82d8a377d66
            python3 tools/ci/check_ci_provider_policy.py
            timeout 600 make -j2 c-header-check build/test_soliding_lifecycle build/test_settled_regions build/test_generation_fields
            timeout 90 ./build/test_soliding_lifecycle
            timeout 90 ./build/test_settled_regions
            timeout 90 ./build/test_generation_fields
            echo "SF_M0_SCOPED_NATIVE_SMOKE_PASSED source=$(git rev-parse HEAD)"
          ) 2>&1 | tee sf-m0-native-smoke/run.log
      - name: Retain exact-head core smoke result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sandfall-sf-m0-head-native-smoke
          path: sf-m0-native-smoke/
          retention-days: 21
          if-no-files-found: warn
