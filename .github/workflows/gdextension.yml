name: GDExtension build and current Godot regression

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
      - 'docs/**'
      - 'AGENTS.md'
      - '.github/pull_request_template.md'
      - 'tools/ci/check_ci_provider_policy.py'
      - 'tools/ci/test_ci_provider_policy.py'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths-ignore:
      - '.github/workflows/**'
      - 'docs/**'
      - 'AGENTS.md'
      - '.github/pull_request_template.md'
      - 'tools/ci/check_ci_provider_policy.py'
      - 'tools/ci/test_ci_provider_policy.py'
  workflow_dispatch:
    inputs:
      physical_actor_stress:
        description: Run the isolated physical actor timeout campaign
        type: boolean
        default: false
      rapier_bvh_pair:
        description: Build and stress paired Rapier control/patched runtimes (requires physical_actor_stress)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: gdextension-${{ github.ref }}-${{ inputs.rapier_bvh_pair == true && github.run_id || (inputs.physical_actor_stress == true && 'physical-stress' || 'suite') }}
  cancel-in-progress: true

env:
  GODOT_URL: https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7
  GODOT_SHA256: 0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c
  GODOT_VERSION: 4.7.stable.official.5b4e0cb0f
  GODOT_CPP_COMMIT: 101ae38034304346a46ea9ea84ae156d3e860496
  LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-ubuntu-22.04-x86_64.tar.xz
  LLVM_MINGW_SHA256: cee8d2ce3da5145ce4dc882e70d0b0719a783d53a99752c60948fc0659975a65

jobs:
  physical-actor-stress:
    if: github.event_name == 'workflow_dispatch' && inputs.physical_actor_stress == true
    uses: ./.github/workflows/physical-actor-stress.yml
    with:
      rapier_pair: ${{ inputs.rapier_bvh_pair == true }}

  ready_scope:
    name: ready validation scope
    if: github.event_name == 'pull_request' && github.event.action == 'ready_for_review'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - name: Classify ready-for-review change scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          ignored_prefixes = (".github/workflows/", "docs/")
          ignored_exact = {
              "AGENTS.md",
              ".github/pull_request_template.md",
              "tools/ci/check_ci_provider_policy.py",
              "tools/ci/test_ci_provider_policy.py",
          }

          files = []
          page = 1
          while True:
              url = (
                  f"https://api.github.com/repos/{os.environ['REPOSITORY']}"
                  f"/pulls/{os.environ['PR_NUMBER']}/files?per_page=100&page={page}"
              )
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  batch = json.load(response)
              files.extend(item["filename"] for item in batch)
              if len(batch) < 100:
                  break
              page += 1

          def ignored(path):
              return path in ignored_exact or path.startswith(ignored_prefixes)

          required = any(not ignored(path) for path in files)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"required={'true' if required else 'false'}\n")
          print(
              "ready-for-review expensive validation:",
              "required" if required else "not required",
          )
          print("\n".join(files))
          PY

  linux-build:
    name: linux build x86_64
    needs: [ready_scope]
    if: >-
      always() && inputs.physical_actor_stress != true &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.draft == false &&
        (github.event.action != 'ready_for_review' ||
         needs.ready_scope.outputs.required == 'true')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Fetch Linux Rapier runtime only
        run: |
          git lfs install --local
          git lfs pull --include="godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so" --exclude=""
          echo "566e68ae53bfb2eb7018c8e7d0dd3727121bf696462039b780a33d6b8369c66a  godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so" | sha256sum --check --strict

      - name: Validate shard planner
        run: |
          python3 -m py_compile tools/ci/run_godot_regressions.py tools/ci/test_godot_regression_sharding.py tools/ci/run_windows_godot_regressions.py tools/ci/test_windows_godot_regressions.py
          python3 tools/ci/test_godot_regression_sharding.py
          python3 tools/ci/test_windows_godot_regressions.py
          python3 tools/ci/test_physical_timeout_diagnostics.py
          python3 tools/ci/test_physical_stress_contract.py
          python3 tools/ci/test_physical_timing_history.py
          python3 tools/ci/test_godot_timeout_diagnostics.py
          python3 tools/ci/test_godot_process_monitor.py
          python3 tools/ci/test_physical_progress_watchdog.py
          python3 tools/ci/test_physical_stress.py
          python3 tools/ci/test_rapier_candidate_identity.py
          python3 tools/ci/test_rapier_pair.py
          python3 tools/ci/test_rapier_same_host.py

      - name: Install pinned SCons
        run: |
          python3 -m venv "$RUNNER_TEMP/scons"
          "$RUNNER_TEMP/scons/bin/python" -m pip install --require-hashes -r tools/requirements-build.txt
          "$RUNNER_TEMP/scons/bin/python" -c 'import SCons; assert SCons.__version__ == "4.10.1"'

      - name: Check out exact godot-cpp source
        run: |
          mkdir "$RUNNER_TEMP/godot-cpp"
          git -C "$RUNNER_TEMP/godot-cpp" init
          git -C "$RUNNER_TEMP/godot-cpp" remote add origin https://github.com/godotengine/godot-cpp.git
          timeout 10m git -C "$RUNNER_TEMP/godot-cpp" fetch --depth=1 origin "$GODOT_CPP_COMMIT"
          git -C "$RUNNER_TEMP/godot-cpp" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/godot-cpp" rev-parse HEAD)" = "$GODOT_CPP_COMMIT"

      - name: Build Linux godot-cpp and CyberSand extension
        env:
          GODOT_CPP_ROOT: ${{ runner.temp }}/godot-cpp
          SCONS_PYTHON: ${{ runner.temp }}/scons/bin/python
          SCONS_JOBS: "2"
          CYBERSAND_REAL_CXX: /usr/bin/g++-13
          LINUX_CXX: /usr/bin/g++-13
          CYBERSAND_NATIVE_OUTPUT: ${{ runner.temp }}/libcybersand_native.linux.x86_64.so
        run: |
          timeout 35m tools/build_pinned_godot_cpp.sh linux
          timeout 20m tools/build_native_extension.sh
          file "$CYBERSAND_NATIVE_OUTPUT" | tee "$RUNNER_TEMP/linux-file.txt"
          grep -q 'ELF 64-bit.*x86-64' "$RUNNER_TEMP/linux-file.txt"

      - name: Validate and stage exact Linux runtime
        env:
          CYBERSAND_NATIVE_OUTPUT: ${{ runner.temp }}/libcybersand_native.linux.x86_64.so
        run: |
          cp "$CYBERSAND_NATIVE_OUTPUT" godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so
          timeout 1m tools/check_linux_runtime_floor.sh
          mkdir -p build/linux-runtime
          cp "$CYBERSAND_NATIVE_OUTPUT" build/linux-runtime/libcybersand_native.linux.x86_64.so
          cp godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so build/linux-runtime/
          git rev-parse HEAD > build/linux-runtime/source-sha.txt
          {
            echo "godot_cpp_commit=$GODOT_CPP_COMMIT"
            echo "scons=4.10.1"
            gcc-13 --version | head -n 1
            g++-13 --version | head -n 1
            ld --version | head -n 1
          } > build/linux-runtime/toolchain.txt
          (
            cd build/linux-runtime
            sha256sum libcybersand_native.linux.x86_64.so libgodot_rapier.linux.x86_64-unknown-linux-gnu.so > runtime.sha256
            sha256sum --check --strict runtime.sha256
          )
          git diff --exit-code -- .             ':!godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so'             ':!godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so'

      - name: Publish Linux runtime for isolated regression shards
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-runtime-${{ github.run_id }}
          path: build/linux-runtime/
          if-no-files-found: error
          retention-days: 1

  windows-build:
    name: windows x86_64
    # Routine Windows cross-build validation runs on the standard GitHub-hosted
    # Ubuntu runner using the pinned LLVM-MinGW toolchain below.
    needs: [ready_scope]
    if: >-
      always() && inputs.physical_actor_stress != true &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.draft == false &&
        (github.event.action != 'ready_for_review' ||
         needs.ready_scope.outputs.required == 'true')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify required host tools
        run: |
          python3 --version
          git --version
          curl --version
          tar --version
          xz --version
          file --version

      - name: Install pinned SCons
        run: |
          python3 -m venv "$RUNNER_TEMP/scons"
          "$RUNNER_TEMP/scons/bin/python" -m pip install --require-hashes -r tools/requirements-build.txt
          "$RUNNER_TEMP/scons/bin/python" -c 'import SCons; assert SCons.__version__ == "4.10.1"'

      - name: Check out exact godot-cpp source
        run: |
          mkdir "$RUNNER_TEMP/godot-cpp"
          git -C "$RUNNER_TEMP/godot-cpp" init
          git -C "$RUNNER_TEMP/godot-cpp" remote add origin https://github.com/godotengine/godot-cpp.git
          timeout 10m git -C "$RUNNER_TEMP/godot-cpp" fetch --depth=1 origin "$GODOT_CPP_COMMIT"
          git -C "$RUNNER_TEMP/godot-cpp" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/godot-cpp" rev-parse HEAD)" = "$GODOT_CPP_COMMIT"

      - name: Prepare exact LLVM-MinGW
        run: |
          timeout 10m curl --fail --location --retry 3 --output "$RUNNER_TEMP/llvm-mingw.tar.xz" "$LLVM_MINGW_URL"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/llvm-mingw"
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          test -x "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-g++"
          if test ! -e "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-gcc-ar"; then
            ln -s llvm-ar "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-gcc-ar"
          fi

      - name: Build Windows godot-cpp and CyberSand extension
        env:
          GODOT_CPP_ROOT: ${{ runner.temp }}/godot-cpp
          SCONS_PYTHON: ${{ runner.temp }}/scons/bin/python
          SCONS_JOBS: "2"
          LLVM_MINGW_ROOT: ${{ runner.temp }}/llvm-mingw
          WINDOWS_CXX: ${{ runner.temp }}/llvm-mingw/bin/x86_64-w64-mingw32-g++
          CYBERSAND_NATIVE_OUTPUT: ${{ runner.temp }}/cybersand_native.windows.x86_64.dll
        run: |
          timeout 35m tools/build_pinned_godot_cpp.sh windows
          timeout 20m tools/build_native_extension_windows.sh
          file "$CYBERSAND_NATIVE_OUTPUT" | tee "$RUNNER_TEMP/windows-file.txt"
          grep -q 'PE32+ executable (DLL).*x86-64' "$RUNNER_TEMP/windows-file.txt"
          "$LLVM_MINGW_ROOT/bin/llvm-objdump" -p "$CYBERSAND_NATIVE_OUTPUT" > "$RUNNER_TEMP/windows-imports.txt"
          sha256sum "$CYBERSAND_NATIVE_OUTPUT"

      - name: Record source-pinned fresh Windows DLL for actual execution
        env:
          CYBERSAND_NATIVE_OUTPUT: ${{ runner.temp }}/cybersand_native.windows.x86_64.dll
        run: |
          set -euo pipefail
          python3 tools/ci/fresh_windows_runtime.py build --dll "$CYBERSAND_NATIVE_OUTPUT" --output-dir build/windows-runtime
          python3 tools/ci/fresh_windows_runtime.py verify --bundle-dir build/windows-runtime --expected-source-sha "$(git rev-parse HEAD)"

      - name: Publish source-matched Windows DLL and manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-runtime-${{ github.run_id }}
          path: build/windows-runtime/
          if-no-files-found: error
          retention-days: 1

  windows-regression:
    name: windows headless regression
    needs: [ready_scope, windows-build]
    if: >-
      always() && needs.windows-build.result == 'success' && inputs.physical_actor_stress != true &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.draft == false &&
        (github.event.action != 'ready_for_review' ||
         needs.ready_scope.outputs.required == 'true')))
    runs-on: windows-2022
    # Full headless suite can include 171+ genuine native/Godot cases plus
    # SF-M4's long Gallery workload; retain every case and avoid job cutoff.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      GODOT_WINDOWS_URL: https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip
      GODOT_SILENCE_ROOT_WARNING: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Check out exact tested source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          lfs: false

      - name: Select Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Materialize pinned Rapier Windows runtime
        timeout-minutes: 5
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll" --exclude=""

      - name: Restore exact-source freshly built Windows DLL
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-runtime-${{ github.run_id }}
          path: build/windows-runtime

      - name: Validate Windows execution harness
        run: |
          set -euo pipefail
          python tools/ci/test_godot_regression_sharding.py
          python tools/ci/test_windows_godot_regressions.py
          python tools/ci/test_fresh_windows_runtime.py
          python tools/ci/test_godot_timeout_diagnostics.py
          python tools/ci/test_godot_process_monitor.py
          python tools/ci/test_physical_progress_watchdog.py
          python tools/ci/test_physical_stress.py
          python tools/ci/test_rapier_candidate_identity.py
          python tools/ci/test_rapier_pair.py
          python tools/ci/test_rapier_same_host.py

      - name: Download official Windows Godot archive
        timeout-minutes: 10
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 --output "$RUNNER_TEMP/godot-windows.zip" "$GODOT_WINDOWS_URL"

      - name: Verify retained runtime and execute every applicable Windows case
        timeout-minutes: 85
        run: |
          set -euo pipefail
          python tools/ci/run_windows_godot_regressions.py --godot-archive "$RUNNER_TEMP/godot-windows.zip" --expected-source-sha "$GITHUB_SHA" --fresh-windows-runtime build/windows-runtime --output build/godot-regressions/windows

      - name: Prove internal watchdog observes a synchronously blocked Windows main thread
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python tools/ci/test_physical_internal_watchdog.py --godot "$RUNNER_TEMP/godot-windows/Godot_v4.7-stable_win64_console.exe"

      - name: Retain actual Windows execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-godot-headless-${{ github.run_id }}
          path: build/godot-regressions/windows/
          if-no-files-found: error
          retention-days: 30

  linux-regression:
    name: linux regression shard ${{ matrix.shard }}
    needs: linux-build
    if: >-
      always() && inputs.physical_actor_stress != true &&
      needs.linux-build.result == 'success' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    # Every shard has >=2 logical CPUs so weighted planning may move the worker
    # parity case without disabling its parallel arm. All use GitHub-hosted CI.
    runs-on: ubuntu-24.04
    # Each shard retains every case; the SF-M4 Gallery alone performs
    # 16 real runs / 9,000+ coupled ticks and needs more than the old 180 s.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Restore exact Linux runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-runtime-${{ github.run_id }}
          path: build/linux-runtime

      - name: Verify and install runtime artifact
        run: |
          test "$(cat build/linux-runtime/source-sha.txt)" = "$(git rev-parse HEAD)"
          (cd build/linux-runtime && sha256sum --check --strict runtime.sha256)
          cp build/linux-runtime/libcybersand_native.linux.x86_64.so godot/addons/cybersand_native/bin/
          cp build/linux-runtime/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so godot/addons/godot-rapier2d/bin/
          timeout 1m tools/check_linux_runtime_floor.sh

      - name: Prepare exact Godot runtime
        run: |
          timeout 10m curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot.zip" "$GODOT_URL"
          echo "$GODOT_SHA256  $RUNNER_TEMP/godot.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot*' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          test "$("$GODOT_BIN" --version)" = "$GODOT_VERSION"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Prove internal watchdog observes a synchronously blocked Linux main thread
        if: matrix.shard == 0
        timeout-minutes: 2
        run: python3 tools/ci/test_physical_internal_watchdog.py --godot "$GODOT_BIN"

      - name: Install software rendering display
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes xvfb xauth libgl1-mesa-dri mesa-utils

      - name: Run isolated regression shard with actual rendered-pixel tests
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          LP_NUM_THREADS: "2"
          GALLIVM_PERF: "nopt"
          CYBERSAND_PRESENTATION_EVIDENCE: ${{ github.workspace }}/build/godot-regressions/shard-${{ matrix.shard }}/presentation
        run: |
          timeout 65m xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24 -nolisten tcp" python3 tools/ci/run_godot_regressions.py --godot "$GODOT_BIN" --output "build/godot-regressions/shard-${{ matrix.shard }}" --shard-count 4 --shard-index "${{ matrix.shard }}" --keep-going
          python3 tools/ci/readback_4ly003_development.py --regression-output "build/godot-regressions/shard-${{ matrix.shard }}" --expect-source-sha "$(git rev-parse HEAD)"
          git diff --exit-code -- .             ':!godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so'             ':!godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so'

      - name: Retain shard evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-godot-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            build/godot-regressions/shard-${{ matrix.shard }}/
            build/linux-runtime/source-sha.txt
            build/linux-runtime/runtime.sha256
          if-no-files-found: warn
          retention-days: 30



  linux-serial-equivalence:
    name: linux serial equivalence
    needs: linux-build
    if: >-
      always() && inputs.physical_actor_stress != true &&
      needs.linux-build.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      vars.GDEXT_SERIAL_EQUIVALENCE == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Restore exact Linux runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-runtime-${{ github.run_id }}
          path: build/linux-runtime

      - name: Verify and install runtime artifact
        run: |
          test "$(cat build/linux-runtime/source-sha.txt)" = "$(git rev-parse HEAD)"
          (cd build/linux-runtime && sha256sum --check --strict runtime.sha256)
          cp build/linux-runtime/libcybersand_native.linux.x86_64.so godot/addons/cybersand_native/bin/
          cp build/linux-runtime/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so godot/addons/godot-rapier2d/bin/
          timeout 1m tools/check_linux_runtime_floor.sh

      - name: Prepare exact Godot runtime
        run: |
          timeout 10m curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot.zip" "$GODOT_URL"
          echo "$GODOT_SHA256  $RUNNER_TEMP/godot.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot*' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          test "$("$GODOT_BIN" --version)" = "$GODOT_VERSION"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Install software rendering display
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes xvfb xauth libgl1-mesa-dri mesa-utils

      - name: Run serial suite with actual rendered-pixel tests
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          LP_NUM_THREADS: "2"
          GALLIVM_PERF: "nopt"
          CYBERSAND_PRESENTATION_EVIDENCE: ${{ github.workspace }}/build/godot-regressions/serial/presentation
        run: |
          timeout 90m xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24 -nolisten tcp" python3 tools/ci/run_godot_regressions.py --godot "$GODOT_BIN" --output build/godot-regressions/serial --keep-going
          python3 tools/ci/readback_4ly003_development.py --regression-output build/godot-regressions/serial --expect-source-sha "$(git rev-parse HEAD)"
          git diff --exit-code -- .             ':!godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so'             ':!godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so'

      - name: Retain serial equivalence evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-godot-serial-${{ github.run_id }}
          path: |
            build/godot-regressions/serial/
            build/linux-runtime/source-sha.txt
            build/linux-runtime/runtime.sha256
          if-no-files-found: warn
          retention-days: 30

  linux-regression-gate:
    name: linux x86_64
    needs: [ready_scope, linux-regression, linux-serial-equivalence]
    if: >-
      always() && inputs.physical_actor_stress != true &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.draft == false &&
        (github.event.action != 'ready_for_review' ||
         needs.ready_scope.outputs.required == 'true')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require all sharded regressions
        run: |
          test "${{ needs.linux-regression.result }}" = "success"

      - name: Require serial equivalence lane during PR migration
        if: github.event_name == 'pull_request' && vars.GDEXT_SERIAL_EQUIVALENCE == '1'
        run: |
          test "${{ needs.linux-serial-equivalence.result }}" = "success"

      - name: Download sharded evidence
        if: github.event_name == 'pull_request' && vars.GDEXT_SERIAL_EQUIVALENCE == '1'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: linux-godot-shard-*-${{ github.run_id }}
          path: build/sharded

      - name: Download serial evidence
        if: github.event_name == 'pull_request' && vars.GDEXT_SERIAL_EQUIVALENCE == '1'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-godot-serial-${{ github.run_id }}
          path: build/serial

      - name: Prove serial and sharded coverage equivalence
        if: github.event_name == 'pull_request' && vars.GDEXT_SERIAL_EQUIVALENCE == '1'
        run: |
          python3 - <<'PY'
          from collections import Counter
          import json
          from pathlib import Path

          shard_files = sorted(Path("build/sharded").glob("**/timings.json"))
          serial_files = sorted(Path("build/serial").glob("**/timings.json"))
          if len(shard_files) != 4:
              raise SystemExit(f"Expected four shard timing files, found {len(shard_files)}: {shard_files}")
          if len(serial_files) != 1:
              raise SystemExit(f"Expected one serial timing file, found {len(serial_files)}: {serial_files}")

          def load(path):
              return json.loads(path.read_text(encoding="utf-8"))

          serial = load(serial_files[0])
          serial_cases = [r["name"] for r in serial["results"] if r["role"] == "case"]
          if any(r["status"] != "passed" for r in serial["results"]):
              raise SystemExit("Serial equivalence suite contains a non-passing result")

          sharded_cases = []
          identities = []
          for path in shard_files:
              payload = load(path)
              if any(r["status"] != "passed" for r in payload["results"]):
                  raise SystemExit(f"Shard contains a non-passing result: {path}")
              sharded_cases.extend(r["name"] for r in payload["results"] if r["role"] == "case")
              identities.append(payload["identity"])

          if Counter(sharded_cases) != Counter(serial_cases):
              raise SystemExit(
                  "Sharded suite coverage differs from serial suite: "
                  f"serial={sorted(serial_cases)} sharded={sorted(sharded_cases)}"
              )
          duplicates = sorted(name for name, count in Counter(sharded_cases).items() if count != 1)
          if duplicates:
              raise SystemExit(f"Sharded cases were not executed exactly once: {duplicates}")

          serial_identity = serial["identity"]
          for identity in identities:
              for key in ("source_sha", "godot_version", "cybersand_runtime", "rapier_runtime"):
                  if identity[key] != serial_identity[key]:
                      raise SystemExit(f"Identity mismatch for {key}: {identity[key]} != {serial_identity[key]}")

          summary = {
              "source_sha": serial_identity["source_sha"],
              "case_count": len(serial_cases),
              "shard_count": 4,
              "serial_cases": serial_cases,
              "sharded_cases": sharded_cases,
              "result": "equivalent",
          }
          Path("build/equivalence.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(f"Equivalent coverage: {len(serial_cases)} unique suite cases across four shards")
          PY

      - name: Retain equivalence proof
        if: github.event_name == 'pull_request' && vars.GDEXT_SERIAL_EQUIVALENCE == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-godot-equivalence-${{ github.run_id }}
          path: build/equivalence.json
          if-no-files-found: error
          retention-days: 30

  physical-timing:
    name: physical regression timing distribution
    needs: [linux-regression, windows-regression]
    if: >-
      always() &&
      (needs.linux-regression.result != 'skipped' ||
       needs.windows-regression.result != 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out timing reducer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Fetch existing per-platform Godot test evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: '*godot*-${{ github.run_id }}'
          path: build/physical-timing-input/
      - name: Produce source-bound distributions, retaining timeouts
        run: |
          python3 tools/ci/physical_timing_report.py \
            --root build/physical-timing-input \
            --output build/physical-timing-report \
            --run-id "${{ github.run_id }}" \
            --attempt "${{ github.run_attempt }}"
      - name: Retain physical regression timing history for this run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: physical-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/physical-timing-report/
          if-no-files-found: warn
          retention-days: 90
