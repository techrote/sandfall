name: Native C++ validation

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
      - 'docs/**'
      - 'AGENTS.md'
      - '.github/pull_request_template.md'
      - 'tools/ci/check_ci_provider_policy.py'
      - 'tools/ci/test_ci_provider_policy.py'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths-ignore:
      - '.github/workflows/**'
      - 'docs/**'
      - 'AGENTS.md'
      - '.github/pull_request_template.md'
      - 'tools/ci/check_ci_provider_policy.py'
      - 'tools/ci/test_ci_provider_policy.py'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ready_scope:
    name: ready validation scope
    if: github.event_name == 'pull_request' && github.event.action == 'ready_for_review'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - name: Classify ready-for-review change scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          ignored_prefixes = (".github/workflows/", "docs/")
          ignored_exact = {
              "AGENTS.md",
              ".github/pull_request_template.md",
              "tools/ci/check_ci_provider_policy.py",
              "tools/ci/test_ci_provider_policy.py",
          }

          files = []
          page = 1
          while True:
              url = (
                  f"https://api.github.com/repos/{os.environ['REPOSITORY']}"
                  f"/pulls/{os.environ['PR_NUMBER']}/files?per_page=100&page={page}"
              )
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  batch = json.load(response)
              files.extend(item["filename"] for item in batch)
              if len(batch) < 100:
                  break
              page += 1

          def ignored(path):
              return path in ignored_exact or path.startswith(ignored_prefixes)

          required = any(not ignored(path) for path in files)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"required={'true' if required else 'false'}\n")
          print(
              "ready-for-review expensive validation:",
              "required" if required else "not required",
          )
          print("\n".join(files))
          PY

  native:
    needs: [ready_scope]
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.draft == false &&
        (github.event.action != 'ready_for_review' ||
         needs.ready_scope.outputs.required == 'true')))
    runs-on: ubuntu-24.04
    # The combined sanitizer builds can consume more than 40 minutes before
    # the final shared-library/benchmark gate begins. Keep their existing
    # per-command bounds and allow the full required job to finish.
    timeout-minutes: 90
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Record compiler and linker identity
        run: |
          gcc-13 --version
          g++-13 --version
          ld --version
          make --version

      # Check shared-worker ownership before the longer independent sanitizer builds.
      - name: Compile and run TSan
        run: |
          timeout 15m make build/tests_tsan
          timeout 15m env TSAN_OPTIONS=halt_on_error=1 ./build/tests_tsan

      - name: Compile C API and native tests
        run: |
          timeout 5m make c-header-check
          timeout 15m make build/tests

      - name: Run native behavioral and integration suite
        run: timeout 15m ./build/tests

      - name: Sanitize physics CLI material admission and sampled accounting
        env:
          ASAN_OPTIONS: detect_leaks=0:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          mkdir -p build/physics-cli-validation
          timeout 5m make physics-characterisation-sanitize 2>&1 | tee build/physics-cli-validation/validation.log

      - name: Retain physics CLI results and sanitizer logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-physics-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/physics-cli-validation/
          if-no-files-found: warn
          retention-days: 30

      - name: Validate procedural generation candidates and fresh chunk admission
        run: timeout 5m make worldgen-test

      - name: Sanitize procedural generation and chunk admission
        run: timeout 10m env ASAN_OPTIONS=detect_leaks=0:strict_string_checks=1 UBSAN_OPTIONS=halt_on_error=1 make worldgen-sanitize

      - name: Run soliding contract regressions
        run: timeout 5m make soliding-test

      - name: Smoke-test isolated discovery characterization
        run: timeout 2m make soliding-benchmark-smoke

      - name: Validate Stage-3B preregistration apparatus
        run: timeout 3m make soliding-stage3b-validation-apparatus-test

      - name: Smoke-test retained Stage-3 benchmark lineage
        run: timeout 3m make soliding-stage3-cost-smoke

      - name: Compile and run ASan plus UBSan
        run: |
          timeout 15m make build/tests_sanitized
          timeout 15m env ASAN_OPTIONS=detect_leaks=0:strict_string_checks=1 UBSAN_OPTIONS=halt_on_error=1 ./build/tests_sanitized

      - name: Build and characterize sanitized settled-regions regression
        run: timeout 20m /usr/bin/time -v make build/test_settled_regions_sanitized

      - name: Compile soliding contract sanitizer executables
        run: |
          timeout 20m make \
            build/test_soliding_lifecycle_sanitized \
            build/test_settled_discovery_sanitized \
            build/test_settled_regions_sanitized \
            build/test_settled_world_discovery_sanitized \
            build/test_stage3b_runtime_storage_sanitized \
            build/test_stage3b_bounded_spatial_index_sanitized \
            build/test_stage3b_sparse_mutation_witness_sanitized \
            build/test_stage3b_sparse_activity_deadline_sanitized

      - name: Sanitize soliding contract regressions
        run: timeout 10m env ASAN_OPTIONS=detect_leaks=0:strict_string_checks=1 UBSAN_OPTIONS=halt_on_error=1 make soliding-sanitize

      - name: Compile shared library and benchmark
        run: |
          timeout 15m make shared
          timeout 15m make build/benchmark
          timeout 10m ./build/benchmark
