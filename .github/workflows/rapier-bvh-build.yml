name: Pinned Rapier BVH control and candidate builds

on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [control, patched]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare exact Rust, pinned Godot and API build dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libclang-dev clang
          curl --fail --location --output "$RUNNER_TEMP/godot.zip" https://downloads.godotengine.org/?flavor=stable\&platform=linux.64\&slug=linux.x86_64.zip\&version=4.7
          echo "0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c  $RUNNER_TEMP/godot.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64"
      - name: Compile original or patched join with matching symbols and inputs
        run: python3 tools/ci/build_rapier_bvh_candidate.py --variant ${{ matrix.variant }} --workspace "$RUNNER_TEMP/rapier" --output build/rapier --godot "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rapier-bvh-linux-${{ matrix.variant }}-${{ github.run_id }}
          path: build/rapier/
          retention-days: 30
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [control, patched]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare exact Rust and hash-verified official Godot
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal
          curl --fail --location --output "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools/ci')
          from run_windows_godot_regressions import prepare_godot
          binary, identity = prepare_godot(Path(os.environ['RUNNER_TEMP']) / 'godot.zip')
          print(identity)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('GODOT_BIN=' + str(binary) + '\n')
          PY
      - name: Compile original or patched join with matching PDB and inputs
        run: python tools/ci/build_rapier_bvh_candidate.py --variant ${{ matrix.variant }} --workspace "$RUNNER_TEMP/rapier" --output build/rapier --godot "$GODOT_BIN"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rapier-bvh-windows-${{ matrix.variant }}-${{ github.run_id }}
          path: build/rapier/
          retention-days: 30
          if-no-files-found: error
